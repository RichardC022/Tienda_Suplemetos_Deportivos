spring.application.name=SysSupplementsGym
spring.main.banner-mode=console

# =====================================================================
# Configuración de la base de datos MySQL
# =====================================================================
# Se utiliza MySQL como base de datos principal.
# La base de datos 'syssupplements' se crea automáticamente
# gracias al parámetro createDatabaseIfNotExist=true en la URL.
# =====================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/syssupplements?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================================
# Configuración de JPA / Hibernate
# =====================================================================
# ddl-auto=update: Hibernate actualiza automáticamente el esquema de la BD
# cuando se detectan cambios en las entidades.
#
# show-sql=true: Muestra las consultas SQL en la consola, útil para debugging.
# =====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================================
# Configuración del servidor
# =====================================================================
server.port=8081
