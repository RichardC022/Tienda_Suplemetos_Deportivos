spring.application.name=SysSupplementsGym
spring.main.banner-mode=console

# =====================================================================
# Configuracion de la base de datos MySQL
# =====================================================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/syssuplements?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================================
# Configuracion del pool de conexiones HikariCP
# =====================================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =====================================================================
# Configuracion de JPA / Hibernate
# =====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# =====================================================================
# Configuracion del servidor
# =====================================================================
server.port=8081

# =====================================================================
# Configuracion de subida de archivos (imagenes de productos)
# =====================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/productos

# =====================================================================
# Configuracion de correo electronico (para recuperacion de PIN)
# =====================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tu_correo@gmail.com
spring.mail.password=tu_contraseña_de_app
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =====================================================================
# Secret para hashing de PINes (SHA-256)
# =====================================================================
app.pin-secret=SysSupGym2024PinSecretKey!
